<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Premium Dark Curved Canvas -->
  <rect width="200" height="200" rx="44" fill="#08090f"/>
  <rect width="198" height="198" x="1" y="1" rx="43" stroke="rgba(255,255,255,0.07)" stroke-width="1.5" fill="none"/>

  <defs>
    <!-- Multi-stop chromatic laser ribbons -->
    <linearGradient id="auraLetterGrad" x1="20" y1="20" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="35%" stop-color="#ec4899" />
      <stop offset="70%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="auraLetterSpecular" x1="100" y1="24" x2="100" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="auraHaloGrad" x1="40" y1="10" x2="160" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="38%" stop-color="#ec4899" />
      <stop offset="76%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="auraOrbitGrad" x1="10" y1="100" x2="190" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="30%" stop-color="#d946ef" />
      <stop offset="70%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>

    <filter id="auraSoftGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="auraAtmosphericBloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="bigBlur" />
      <feGaussianBlur stdDeviation="2.5" result="sharpBlur" />
      <feMerge>
        <feMergeNode in="bigBlur" />
        <feMergeNode in="sharpBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Atmospheric Background Core Light -->
  <circle cx="100" cy="88" r="64" fill="url(#auraLetterGrad)" opacity="0.14" filter="blur(16px)"/>

  <!-- Background Halo -->
  <circle cx="100" cy="70" r="52" stroke="url(#auraHaloGrad)" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.88" filter="url(#auraSoftGlow)"/>

  <!-- Orbital Ring Back -->
  <path d="M 22 105 C 22 88, 178 88, 178 105" stroke="url(#auraOrbitGrad)" stroke-width="3.5" fill="none" opacity="0.45"/>

  <!-- Main "A" Ribbon -->
  <path d="M 100 28 C 112 28, 124 48, 140 92 L 155 135 C 158 143, 150 146, 142 142 L 128 112 C 123 100, 118 92, 112 88 C 108 85, 104 88, 100 94 C 96 88, 92 85, 88 88 C 82 92, 77 100, 72 112 L 58 142 C 50 146, 42 143, 45 135 L 60 92 C 76 48, 88 28, 100 28 Z" fill="url(#auraLetterGrad)" filter="url(#auraAtmosphericBloom)"/>

  <!-- Specular Reflection Overlay on "A" Ribbon -->
  <path d="M 100 28 C 112 28, 124 48, 140 92 L 155 135 C 158 143, 150 146, 142 142 L 128 112 C 123 100, 118 92, 112 88 C 108 85, 104 88, 100 94 C 96 88, 92 85, 88 88 C 82 92, 77 100, 72 112 L 58 142 C 50 146, 42 143, 45 135 L 60 92 C 76 48, 88 28, 100 28 Z" fill="url(#auraLetterSpecular)"/>

  <!-- Inner Heart Cutout -->
  <path d="M 100 92 C 105 84, 118 82, 125 92 C 132 102, 128 118, 116 130 C 108 138, 102 143, 100 145 C 98 143, 92 138, 84 130 C 72 118, 68 102, 75 92 C 82 82, 95 84, 100 92 Z" fill="#08090f"/>

  <!-- Inner Heart Glowing Stroke -->
  <path d="M 100 96 C 104 88, 116 86, 122 95 C 128 104, 124 117, 113 128 C 106 135, 101 139, 100 141 C 99 139, 94 135, 87 128 C 76 117, 72 104, 78 95 C 84 86, 96 88, 100 96 Z" stroke="url(#auraLetterGrad)" stroke-width="3" fill="none" filter="url(#auraSoftGlow)"/>

  <!-- Orbital Ring Front -->
  <path d="M 22 105 C 22 122, 178 122, 178 105" stroke="url(#auraOrbitGrad)" stroke-width="4.5" stroke-linecap="round" fill="none" filter="url(#auraAtmosphericBloom)"/>
</svg>
