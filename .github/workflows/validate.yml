name: Validate AURA

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - run: node scripts/test_discovery_regression.mjs
